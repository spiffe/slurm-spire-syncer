# Default configuration, installed to /etc/spire/slurm-syncer/default.conf.
#
# Loaded with -expand-env, so ${VAR} references are filled from the unit's
# environment. Every one of them is optional except the trust domain: an
# unset variable expands to the empty string, which each setting below treats as
# "use the built-in default".
#
# This file is shared by every instance. To change one instance without touching
# it, set the variables below in /etc/spire/slurm-syncer/<instance>.conf, or
# replace the file wholesale with /etc/spire/slurm-syncer/<instance>/config,
# which takes precedence over both.

# Written by the SPIRE packages to /etc/spiffe/default-trust-domain.env and read
# by every SPIFFE unit on the host. This is the one value with no default.
trustDomain: ${SPIFFE_TRUST_DOMAIN}

# Set by the unit from the instance name, so instance "main" talks to
# /run/spire/server/sockets/main/private/api.sock.
spireServerSocket: ${SPIRE_SERVER_SOCKET}

# How often to poll Slurm, list entries and reconcile. Empty means 10s.
interval: "${SLURM_SYNCER_INTERVAL}"

# Prefix for generated entry IDs. Ownership needs this and the hint together, and
# entries matching only one are never touched. Empty means "slurm". Two instances
# pointed at the SAME SPIRE server must not share it, or each will treat the
# other's entries as strays.
className: "${SLURM_SYNCER_CLASS_NAME}"

# hint is deliberately absent rather than templated. Unlike everything above, an
# empty hint is a real setting -- it disables hint stamping and the server-side
# list filter -- so an unset ${VAR} would silently select that degraded path.
# Leaving the key out gives the default of "slurm" and lets
# SLURM_SPIRE_SYNCER_HINT override it, including to empty on purpose.

# Prometheus listener. Empty disables it. Each instance needs its own port.
metricsAddr: "${SLURM_SYNCER_METRICS_ADDR}"

# The parent ID must resolve to the SPIRE agent that actually serves that node,
# or the entry is created successfully and then never delivered to any workload
# -- a failure that looks like attestation not working.
#
# The default assumes an agent attested with x509pop under an agent path template
# ending in the node name. Other attestors give other shapes: join_token, for
# instance, yields spiffe://<trust-domain>/agent/<node-id>. Check yours with
# `spire-server agent list` and override if it differs.
#
# Empty means the defaults shown here:
#   parent: spiffe://{{.TrustDomain}}/spire/agent/x509pop/{{.Node}}
#   spiffe: spiffe://{{.TrustDomain}}/slurm/{{.Account}}/{{.JobKey}}
parentIDTemplate: "${SLURM_SYNCER_PARENT_ID_TEMPLATE}"
spiffeIDTemplate: "${SLURM_SYNCER_SPIFFE_ID_TEMPLATE}"
